name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "=== Deploying places-autocomplete ==="
          supabase functions deploy places-autocomplete --project-ref kjibbbuceipnialfgflt --no-verify-jwt --debug || echo "FAILED: places-autocomplete"
          echo "=== Deploying send-booking-email ==="
          supabase functions deploy send-booking-email --project-ref kjibbbuceipnialfgflt --no-verify-jwt --debug || echo "FAILED: send-booking-email"
          echo "=== Deploying yoco-checkout ==="
          supabase functions deploy yoco-checkout --project-ref kjibbbuceipnialfgflt --no-verify-jwt --debug || echo "FAILED: yoco-checkout"
          echo "=== Deploying yoco-webhook ==="
          supabase functions deploy yoco-webhook --project-ref kjibbbuceipnialfgflt --no-verify-jwt --debug || echo "FAILED: yoco-webhook"
          echo "=== Deploying register-yoco-webhook ==="
          supabase functions deploy register-yoco-webhook --project-ref kjibbbuceipnialfgflt --debug || echo "FAILED: register-yoco-webhook"
          echo "=== All deploy attempts complete ==="
