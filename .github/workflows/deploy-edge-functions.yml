name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 1.23.4

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy places-autocomplete --project-ref kjibbbuceipnialfgflt --no-verify-jwt
          supabase functions deploy send-booking-email --project-ref kjibbbuceipnialfgflt --no-verify-jwt
          supabase functions deploy yoco-checkout --project-ref kjibbbuceipnialfgflt --no-verify-jwt
          supabase functions deploy yoco-webhook --project-ref kjibbbuceipnialfgflt --no-verify-jwt
          supabase functions deploy register-yoco-webhook --project-ref kjibbbuceipnialfgflt
