<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NextSlot ad · A · DM chaos</title>
<link rel="stylesheet" href="ad-core.css">
<style>
/* ── Hook: DM chaos ── */
#s1 .h { color: #F5F0E7; font-size: 92px; top: 190px; padding: 0 80px; }
#s1 .h span { color: var(--gold); }
.bubble { position: absolute; max-width: 640px; padding: 26px 34px; border-radius: 34px;
  font-size: 40px; font-weight: 500; line-height: 1.25; color: #F5F0E7; background: #2F2720;
  box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.bubble.me { background: #3D3127; }
.bubble small { display: block; font-size: 24px; opacity: .55; margin-top: 8px; font-weight: 500; }
.stamp { position: absolute; left: 50%; top: 1240px; padding: 22px 48px; border: 10px solid var(--red); color: var(--red);
  font-family: Montserrat; font-weight: 800; font-size: 104px; letter-spacing: .04em; border-radius: 24px; white-space: nowrap;
  transform-origin: center; background: rgba(21,17,13,.55); }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- 1. Hook -->
  <div class="scene dark" id="s1">
    <div class="center h" id="s1h">Still running your bookings from your <span>DMs?</span></div>
    <div class="bubble" data-x="90" data-y="560" data-r="-2">Hi! Are you free Saturday? <small>23:41</small></div>
    <div class="bubble me" data-x="330" data-y="740" data-r="1.5">Which time? 🙈 <small>23:58</small></div>
    <div class="bubble" data-x="110" data-y="900" data-r="-1">How much for lashes again? <small>00:12</small></div>
    <div class="bubble" data-x="260" data-y="1080" data-r="2">Can I move to 3pm?? <small>07:05</small></div>
    <div class="bubble" data-x="70" data-y="1250" data-r="-2.5">Running late, sorry!! <small>09:52</small></div>
    <div class="bubble me" data-x="300" data-y="1420" data-r="1">Will pay deposit later 🙏 <small>10:03</small></div>
    <div class="stamp" id="stamp">NO-SHOW</div>
  </div>

  <div id="wipe"></div>

  <div class="scene c-reveal" id="s2"></div>
  <div class="scene c-phone" id="s3"></div>
  <div class="scene c-pay" id="s4"></div>
  <div class="scene c-insights" id="s5"></div>
  <div class="scene c-who" id="s6"></div>
  <div class="scene c-cta" id="s7"></div>
</div>

<script src="ad-core.js"></script>
<script>
mount("#s2", C.reveal({ tag: "Booking software for independent service businesses." }));
mount("#s3", C.phone({ title: 'Your own <span class="bronze">booking page.</span>', sub: "Clients book &amp; pay 24/7. No back-and-forth." }));
mount("#s4", C.pay({ line1: "Deposits upfront.", line2: "Fewer no-shows." }));
mount("#s5", C.insights());
mount("#s6", C.who({ headline: "Built for <span>independent</span> pros like you." }));
mount("#s7", C.cta());

defineAd({
  windows: { s1: [0, 3.3], s2: [3.25, 6.0], s3: [5.9, 10.05], s4: [9.95, 12.85], s5: [12.75, 16.0], s6: [15.9, 18.05], s7: [17.95, 20.1] },
  render(t) {
    // ── Hook: messages pile up, then a no-show ──
    if (t < 3.6) {
      rise($("#s1h"), t, 0.1, .55);
      $$("#s1 .bubble").forEach((b, i) => {
        const a = 0.45 + i * 0.32, p = back(prog(t, a, a + .32)), out = eio(prog(t, 2.95, 3.3));
        const x = +b.dataset.x, y = +b.dataset.y, r = +b.dataset.r;
        b.style.left = x + "px"; b.style.top = y + "px";
        b.style.opacity = cl(prog(t, a, a + .12)) * (1 - out);
        b.style.transform = `translateY(${(1 - p) * 40 + out * 80}px) scale(${lerp(.6, 1, p) * (1 - out * .15)}) rotate(${r + out * r * 4}deg)`;
        b.style.filter = `blur(${out * 10}px)`;
      });
      const sp = prog(t, 2.45, 2.65), so = eio(prog(t, 3.0, 3.3));
      const st = $("#stamp");
      st.style.opacity = (sp > 0 ? 1 : 0) * (1 - so);
      st.style.transform = `translateX(-50%) rotate(-12deg) scale(${lerp(2.4, 1, eo(sp)) * (1 + so * .2)})`;
      $("#s1h").style.opacity = (+$("#s1h").style.opacity) * (1 - so);
    }
    R.wipe(t, 3.05);
    R.reveal(t, 3.25, "#s2");
    R.phone(t, 5.9);
    R.pay(t, 9.95);
    R.insights(t, 12.75);
    R.who(t, 15.9, "#s6");
    R.cta(t, 17.95);
  },
});
</script>
</body>
</html>
