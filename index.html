<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Force browsers to always revalidate — prevents stale JS bundles after deploys -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="NextSlot" />

    <!-- Dynamic PWA manifest -->
    <script>
      (function () {
        var isAdmin = window.location.pathname.startsWith('/admin');
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = isAdmin
          ? 'https://kjibbbuceipnialfgflt.supabase.co/functions/v1/manifest?admin=1'
          : 'https://kjibbbuceipnialfgflt.supabase.co/functions/v1/manifest';
        document.head.appendChild(link);
      })();
    </script>

    <!-- PWA / Theme -->
    <!--
      theme-color MUST be declared before the script below that updates it,
      otherwise document.querySelector finds nothing and Safari falls back
      to its own default (black in dark mode) for the status bar.
      Cache-bust: v2
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent: status bar overlays the app content so the tenant
      background colour shows behind the clock/signal/battery icons.
      The booking header already uses pt-[max(env(safe-area-inset-top),12px)]
      so content is never obscured by the status bar.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Theme-color: set synchronously before React boots so the iOS/Android
      status bar matches the tenant background from the very first frame.

      Resolution order:
        1. localStorage ns_business_theme  — returning visitors get the exact
           colour of their last-known tenant theme instantly, no flash.
        2. Default #ffffff                 — first visit or unknown theme falls
           back to white (standard theme background), never black.

      BusinessThemeProvider updates this meta tag again after the Supabase
      fetch resolves, keeping it in sync for theme changes mid-session.

      Marketing pages (/), Login, Onboarding: no tenant slug in localStorage
      on first visit so they get #ffffff which is correct for those light pages.
    -->
    <script>
      (function () {
        var THEME_BACKGROUNDS = {
          'standard':      '#ffffff',
          'makeup-artist': '#ede4d4',
          'beautician':    '#deebd4',
          'lash-tech':     '#f0dde3',
          'nail-tech':     '#f2dde8',
          'tattoo-artist': '#141414',
          'barber':        '#1e2530'
        };
        var stored = '';
        try { stored = localStorage.getItem('ns_business_theme') || ''; } catch (e) {}
        var color = THEME_BACKGROUNDS[stored] || '#ffffff';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', color);
      })();
    </script>

    <!-- Canonical -->
    <link rel="canonical" href="https://www.nextslot.co.za/" />

    <!-- Primary SEO -->
    <title>NextSlot | Online Booking System for Service Businesses in South Africa</title>
    <meta name="description" content="You're fully booked but your income still feels random. NextSlot shows South African service businesses exactly where their revenue, clients, and growth come from. Stop guessing. Start growing. Set up in under 10 minutes, no card required." />
    <meta name="keywords" content="online booking system South Africa, beautician booking app, barber appointment software, hairdresser booking, massage therapist scheduling, tattoo artist booking, photographer appointment, nail technician booking, image consultant scheduling, SA booking platform, POPIA compliant booking, NextSlot" />
